# Gera os instaladores. Com tag vX.Y.Z, publica uma Release para download.
# Sem tag (Actions > Release > Run workflow), só gera os arquivos para teste.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac
            files: |
              release/*.dmg
          - os: windows-latest
            cmd: npx electron-builder --win
            files: |
              release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir chaves do Telegram
        shell: bash
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Cadastre os segredos TELEGRAM_API_ID e TELEGRAM_API_HASH em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          LEX_REQUIRE_KEYS: '1'
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir chaves do Telegram
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Cadastre os segredos TELEGRAM_API_ID e TELEGRAM_API_HASH."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:mobile
        env:
          LEX_REQUIRE_KEYS: '1'
      - run: npx cap sync android
      - name: Firebase (notificações push), se configurado
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Push ligado (google-services.json presente)."
          else
            echo "::warning::Sem GOOGLE_SERVICES_JSON: o .apk sai sem notificações push (usa o modo conectado em segundo plano)."
          fi
      - name: Chave de assinatura do Android (segredo)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lex.keystore"
            echo "LEX_KEYSTORE_FILE=$RUNNER_TEMP/lex.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Cadastre os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD antes de publicar."
            exit 1
          else
            echo "::warning::Sem a chave oficial: o .apk de teste sai com assinatura de depuração."
          fi
      - name: Gerar o .apk
        working-directory: android
        env:
          LEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/LexMessenger-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-android
          path: release/*.apk
          if-no-files-found: error
  ios:
    # App do iPhone sem assinatura (.ipa): o Sideloadly (ou AltStore) assina com o Apple ID de quem instala.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir chaves do Telegram
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Cadastre os segredos TELEGRAM_API_ID e TELEGRAM_API_HASH."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
        env:
          LEX_REQUIRE_KEYS: '1'
      - run: npx cap sync ios
      - name: Gerar o .ipa
        run: |
          set -o pipefail
          v=$(node -p "require('./package.json').version")
          code=$(node -p "v='$v'.split('.').map(Number); v[0]*10000+v[1]*100+v[2]")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$v" CURRENT_PROJECT_VERSION="$code" build | tail -20
          mkdir -p Payload release
          cp -R build/ios/Build/Products/Release-iphoneos/App.app Payload/
          # Assinatura provisória com as permissões (grupo compartilhado app + widget); quem instala assina de novo.
          codesign -f -s - --entitlements ios/App/LexWidget/LexWidget.entitlements Payload/App.app/PlugIns/LexWidget.appex
          codesign -f -s - --entitlements ios/App/App/App.entitlements Payload/App.app
          codesign -d --entitlements - Payload/App.app | grep -q application-groups
          zip -qr release/LexMessenger-iPhone.ipa Payload
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-iphone
          path: release/*.ipa
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## ${GITHUB_REF_NAME}/{f=1;next}/^## /{f=0}f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" out/* --title "Lex Messenger ${GITHUB_REF_NAME}" --notes "${notes:-Nova versão.}"
